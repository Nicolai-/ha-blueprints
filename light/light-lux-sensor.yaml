blueprint:
  name: Light Lux Sensor
  description: >
    This blueprint will turn on/off the selected lights based on a lux level
    threshold and delay.


    **Version:** 1.1.0


    **Changelog:**

    - 1.1.0:
      - Description uses a block scalar so Markdown renders in the UI.
      - Consistent 2-space indentation.
      - Uses the actions syntax and requires Home Assistant 2024.10.0 or newer.
      - Clearer description of the lux sensor input.
      - No "Already running" warnings in the log when triggers overlap.
      - Fixed a YAML error that stopped the blueprint from loading.
      - An unavailable or unknown lux sensor no longer turns the light on.
      - The 10 minute re-check is replaced by a check at Home Assistant
        start. The light is only switched when its state needs to change,
        so manual changes are kept and the delay is always respected.
      - New "Lux hysteresis" input (default 10 lx). Lights turn off above
        the threshold plus the hysteresis, so they no longer switch on and
        off when the lamp itself lights up the sensor.
      - The lux sensor can no longer be left empty.
      - The lux threshold can be set up to 1000 lx (was 100 lx).
      - Several lights can be selected. Only the lights that need to change
        are switched. Existing automations keep working.

    - 1.0.1: Fixed a type issue and re-check the lux level every 10 minutes.

    - 1.0.0: Initial release.
  domain: automation
  author: Nicolai-
  homeassistant:
    min_version: '2024.10.0'
  input:
    lux_sensor_entity:
      name: (Required) Lux Sensor Entity
      description: Illuminance sensor that measures the light level the lights react to.
      selector:
        entity:
          filter:
          - domain:
            - sensor
            device_class:
            - illuminance
          multiple: false
          reorder: false
    lux_threshold_level:
      name: (Required) Lux level threshold
      description: >
        Turn on lights when the lux level is below this value. They turn off
        again when it is above this value plus the hysteresis.
      default: 50.0
      selector:
        number:
          min: 0.0
          max: 1000.0
          mode: box
          unit_of_measurement: lx
          step: 1.0
    lux_hysteresis:
      name: Lux hysteresis
      description: >
        Extra lux above the threshold before lights turn off. Set it higher
        than the light the lamp itself adds to the sensor, so turning the
        light on does not push the reading over the off level and make the
        light switch on and off. 0 uses the same level for on and off.
      default: 10
      selector:
        number:
          min: 0.0
          max: 500.0
          mode: box
          unit_of_measurement: lx
          step: 1.0
    delay_minutes:
      name: Delay (minutes)
      description: The duration lux levels must be above/below the threshold before
        triggering the action.
      default: 10
      selector:
        number:
          min: 1.0
          max: 60.0
          unit_of_measurement: minutes
          step: 1.0
          mode: slider
    light:
      name: (Required) Lights
      description: Lights which will be controlled with this automation.
      selector:
        entity:
          filter:
          - domain:
            - light
          multiple: true
          reorder: false
    on_brightness:
      name: On brightness
      description: Brightness % to force when turning on the light
      default: 100
      selector:
        number:
          min: 1.0
          max: 100.0
          step: 1.0
          unit_of_measurement: "%"
          mode: slider
    on_color_temperature:
      name: On Color Temperature
      description: The colour temperature setting for the lights when they are turned
        ON.
      default: 2700
      selector:
        number:
          min: 2000.0
          max: 8000.0
          mode: slider
          step: 100.0
          unit_of_measurement: kelvin
    light_transition:
      name: Light Transition
      description: Number that represents the time (in milliseconds) the light should
        take turn on or off, if the light supports it.
      default: 250
      selector:
        number:
          min: 0.0
          max: 60000.0
          step: 1.0
          unit_of_measurement: milliseconds
          mode: box
  source_url: https://github.com/Nicolai-/ha-blueprints/blob/main/light/light-lux-sensor.yaml
trigger_variables:
  lux_sensor_entity: !input lux_sensor_entity
  lux_threshold_level: !input lux_threshold_level
  lux_hysteresis: !input lux_hysteresis
variables:
  light: !input light
  # Automations created before 1.1.0 store a single entity id as a string
  lights: "{{ [light] if light is string else light | list }}"
  on_brightness: !input on_brightness
  on_color_temperature: !input on_color_temperature
  light_transition: !input light_transition
triggers:
- alias: Lux level above the threshold plus hysteresis
  trigger: template
  value_template: >-
    {{ states(lux_sensor_entity) | is_number
       and states(lux_sensor_entity) | float
         > lux_threshold_level | float + lux_hysteresis | float }}
  for:
    minutes: !input delay_minutes
- trigger: numeric_state
  entity_id: !input lux_sensor_entity
  below: !input lux_threshold_level
  for:
    minutes: !input delay_minutes
- trigger: homeassistant
  event: start
actions:
- alias: Stop when the lux sensor has no numeric value
  condition: template
  value_template: "{{ states(lux_sensor_entity) | is_number }}"
- variables:
    current_lux_level: "{{ states(lux_sensor_entity) | float(0) }}"
    lights_off: "{{ lights | select('is_state', 'off') | list }}"
    lights_on: "{{ lights | select('is_state', 'on') | list }}"
- choose:
  - alias: Turn on the lights that are off when below threshold
    conditions:
    - "{{ current_lux_level < lux_threshold_level | float }}"
    - "{{ lights_off | count > 0 }}"
    sequence:
    - action: light.turn_on
      target:
        entity_id: "{{ lights_off }}"
      data:
        brightness_pct: "{{ on_brightness }}"
        color_temp_kelvin: "{{ on_color_temperature }}"
        transition: "{{ light_transition / 1000 }}"
  - alias: Turn off the lights that are on when above threshold plus hysteresis
    conditions:
    - "{{ current_lux_level > lux_threshold_level | float + lux_hysteresis | float }}"
    - "{{ lights_on | count > 0 }}"
    sequence:
    - action: light.turn_off
      target:
        entity_id: "{{ lights_on }}"
      data:
        transition: "{{ light_transition / 1000 }}"
mode: single
max_exceeded: silent
