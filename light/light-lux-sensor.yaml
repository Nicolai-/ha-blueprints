blueprint:
  name: Light Lux Sensor
  description: >
    This blueprint will turn on/off selected light based on a lux level
    threshold and delay.


    **Version:** 1.1.0


    **Changelog:**

    - 1.1.0:
      - Description uses a block scalar so Markdown renders in the UI.
      - Consistent 2-space indentation.
      - Uses the actions syntax and requires Home Assistant 2024.10.0 or newer.
      - Clearer description of the lux sensor input.
      - No "Already running" warnings in the log when triggers overlap.
      - Fixed a YAML error that stopped the blueprint from loading.
      - An unavailable or unknown lux sensor no longer turns the light on.

    - 1.0.1: Fixed a type issue and re-check the lux level every 10 minutes.

    - 1.0.0: Initial release.
  domain: automation
  author: Nicolai-
  homeassistant:
    min_version: '2024.10.0'
  input:
    lux_sensor_entity:
      name: (Required) Lux Sensor Entity
      description: Illuminance sensor that measures the light level the lights react to.
      default: ""
      selector:
        entity:
          filter:
          - domain:
            - sensor
            device_class:
            - illuminance
          multiple: false
          reorder: false
    lux_threshold_level:
      name: (Required) Lux level threshold
      description: Turn on lights when below and turn off lights when above.
      default: 50.0
      selector:
        number:
          min: 0.0
          max: 100.0
          mode: box
          unit_of_measurement: lx
          step: 1.0
    delay_minutes:
      name: Delay (minutes)
      description: The duration lux levels must be above/below the threshold before
        triggering the action.
      default: 10
      selector:
        number:
          min: 1.0
          max: 60.0
          unit_of_measurement: minutes
          step: 1.0
          mode: slider
    light:
      name: (Required) Light
      description: Light which will be controlled with this automation.
      selector:
        entity:
          filter:
          - domain:
            - light
          multiple: false
          reorder: false
    on_brightness:
      name: On brightness
      description: Brightness % to force when turning on the light
      default: 100
      selector:
        number:
          min: 1.0
          max: 100.0
          step: 1.0
          unit_of_measurement: "%"
          mode: slider
    on_color_temperature:
      name: On Color Temperature
      description: The colour temperature setting for the lights when they are turned
        ON.
      default: 2700
      selector:
        number:
          min: 2000.0
          max: 8000.0
          mode: slider
          step: 100.0
          unit_of_measurement: kelvin
    light_transition:
      name: Light Transition
      description: Number that represents the time (in milliseconds) the light should
        take turn on or off, if the light supports it.
      default: 250
      selector:
        number:
          min: 0.0
          max: 60000.0
          step: 1.0
          unit_of_measurement: milliseconds
          mode: box
  source_url: https://github.com/Nicolai-/ha-blueprints/blob/main/light/light-lux-sensor.yaml
variables:
  lux_sensor_entity: !input lux_sensor_entity
  light: !input light
  on_brightness: !input on_brightness
  on_color_temperature: !input on_color_temperature
  light_transition: !input light_transition
  lux_threshold_level: !input lux_threshold_level
triggers:
- trigger: numeric_state
  entity_id: !input lux_sensor_entity
  above: !input lux_threshold_level
  for:
    minutes: !input delay_minutes
- trigger: numeric_state
  entity_id: !input lux_sensor_entity
  below: !input lux_threshold_level
  for:
    minutes: !input delay_minutes
- trigger: time_pattern
  minutes: /10
actions:
- alias: Stop when the lux sensor has no numeric value
  condition: template
  value_template: "{{ states(lux_sensor_entity) | is_number }}"
- variables:
    current_lux_level: "{{ states(lux_sensor_entity) | float(0) }}"
- choose:
  - alias: Turn on when below threshold
    conditions: "{{ current_lux_level < lux_threshold_level | float }}"
    sequence:
    - action: light.turn_on
      target:
        entity_id: !input light
      data:
        brightness_pct: "{{ on_brightness }}"
        color_temp_kelvin: "{{ on_color_temperature }}"
        transition: "{{ light_transition / 1000 }}"
  default:
  - alias: Turn off when above threshold
    action: light.turn_off
    target:
      entity_id: !input light
    data:
      transition: "{{ light_transition / 1000 }}"
mode: single
max_exceeded: silent
