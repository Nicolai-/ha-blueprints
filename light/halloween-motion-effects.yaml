blueprint:
  name: Halloween Motion Effects
  description: >
    Run a spooky light effect on non-RGB (dimmable) lights when motion is
    detected on a chosen date and within a time window. Effects are designed
    for a Zigbee2MQTT group: every command is sent once to the group, and the
    command rate is kept low so group broadcasts do not flood the Zigbee mesh.
    The member lights are snapshotted before the effect and restored afterwards.


    **Effects:**

    - **Lightning storm:** darkness with random bursts of 1-3 flashes, followed
      by thunder on the speaker.

    - **Jump scare:** silent blackout, then all lights slam to full brightness
      together with a scream, followed by haunted flicker while the scream
      repeats every 10-15 seconds (adjustable).

    - **Power failure:** the lights sputter, fade out, stay dark, then surge
      back on.

    - **Heartbeat:** a pulse that speeds up over the first 2 minutes, in
      time with the heartbeat sound.

    - **Haunted flicker:** irregular brightness changes with short blackouts.
      With member lights selected, each light flickers on its own using direct
      commands, which allows a much faster flicker than group commands.


    The intensity setting controls how fast and wild the flicker, sputter and
    lightning get.


    A matching sound pack is available in light/sounds/halloween. Upload the
    files to /media/halloween in Home Assistant to use the default sounds.


    When several effects are selected, a random one is picked on every motion
    trigger. Select a single effect to lock it. Add a text helper as effect
    history to shuffle instead: every effect then plays once, in random order,
    before any effect repeats.


    **Version:** 1.7.0


    **Changelog:**

    - 1.7.0: Haunted flicker changes at most 4 member lights per step on
      aggressive (3 on normal, 1 on calm), so large groups no longer flood
      the Zigbee network.

    - 1.6.0: The jump scare scream now repeats every 10-15 seconds by
      default, with new inputs to set the shortest and longest interval.

    - 1.5.0: Heartbeat lights now follow the same beat schedule as the
      heartbeat sound (2.5 s to 1.5 s over the first 2 minutes) and are timed
      against the clock so they do not drift. Re-upload heartbeat.wav.

    - 1.4.0: The jump scare scream now repeats every 2-5 seconds for the
      whole effect instead of playing once.

    - 1.3.0: Optional shuffle mode. With an input_text helper selected as
      effect history, every enabled effect plays once before any repeats,
      and a new round never starts with the effect that just played.

    - 1.2.0: Haunted flicker now changes several member lights per step
      (about half of them on aggressive) instead of one, so every light
      flickers several times per second.

    - 1.1.0: Added an intensity setting (calm, normal, aggressive). Haunted
      flicker and power failure sputter now drive the member lights
      individually for a faster, independent flicker. Aggressive mode gives
      more frequent lightning with longer flash bursts.

    - 1.0.0: Initial release with lightning, jump scare, power failure,
      heartbeat and flicker effects, optional sounds and state restore.
  domain: automation
  author: Nicolai-
  homeassistant:
    min_version: "2024.10.0"
  input:
    trigger_section:
      name: Trigger & Schedule
      icon: mdi:calendar-clock
      input:
        motion_sensors:
          name: (Required) Motion Sensors
          description: Motion sensors that start the effect when they detect motion.
          selector:
            entity:
              filter:
                - domain: binary_sensor
                  device_class:
                    - motion
                    - occupancy
                    - presence
              multiple: true
        event_date:
          name: (Required) Date
          description: The date on which the effect is active.
          default: '2026-10-31'
          selector:
            date:
        repeat_yearly:
          name: Repeat every year
          description: Only compare month and day, so the date matches every year.
          default: true
          selector:
            boolean:
        start_time:
          name: (Required) Start time
          description: Effects can start from this time.
          default: '17:00:00'
          selector:
            time:
        end_time:
          name: (Required) End time
          description: >
            Effects can no longer start after this time. A window crossing
            midnight is supported, but only the part on the selected date is
            active.
          default: '23:00:00'
          selector:
            time:
        cooldown_minutes:
          name: Cooldown
          description: Minimum pause after an effect finishes before motion can start a new one.
          default: 1
          selector:
            number:
              min: 0
              max: 30
              step: 1
              unit_of_measurement: minutes
              mode: slider

    light_section:
      name: Lights
      icon: mdi:lightbulb-group
      input:
        effect_light_group:
          name: (Required) Zigbee2MQTT light group
          description: >
            Light group created in Zigbee2MQTT. All effect commands are sent to
            this group so the lights react in sync with a single Zigbee command.
          selector:
            entity:
              filter:
                - domain: light
                  integration: mqtt
              multiple: false
        restore_lights:
          name: Member lights
          description: >
            The individual lights in the group. They are snapshotted before the
            effect and restored afterwards, and the flicker and sputter effects
            control them one by one so each light flickers on its own. When
            empty, the group itself is used for flicker and restore.
          default: []
          selector:
            entity:
              filter:
                - domain: light
              multiple: true

    effect_section:
      name: Effects
      icon: mdi:ghost
      input:
        enabled_effects:
          name: Effects
          description: >
            Effects to choose from. A random one is picked on every trigger, or
            the next one in the shuffle when an effect history helper is set.
            Select one effect to always use it.
          default:
            - lightning
            - jump_scare
            - power_failure
            - heartbeat
            - flicker
          selector:
            select:
              multiple: true
              options:
                - label: Lightning storm
                  value: lightning
                - label: Jump scare
                  value: jump_scare
                - label: Power failure
                  value: power_failure
                - label: Heartbeat
                  value: heartbeat
                - label: Haunted flicker
                  value: flicker
        effect_history_helper:
          name: Effect history (shuffle)
          description: >
            Optional Text helper (input_text) used to remember which effects
            have played. When set, every enabled effect plays once in random
            order before any effect repeats. Create it under Settings > Devices
            & services > Helpers > Text; the default maximum length of 100 is
            enough. Leave empty for a fully random pick on every trigger.
          default: ''
          selector:
            entity:
              filter:
                - domain: input_text
              multiple: false
        effect_duration_minutes:
          name: Effect duration
          description: How long the effect runs before the lights are restored.
          default: 5
          selector:
            number:
              min: 1
              max: 30
              step: 1
              unit_of_measurement: minutes
              mode: slider
        effect_intensity:
          name: Intensity
          description: >
            How fast and wild the flicker, sputter and lightning are. Aggressive
            sends more Zigbee commands; if lights start lagging or missing
            commands, step down to normal.
          default: aggressive
          selector:
            select:
              mode: list
              options:
                - label: Calm
                  value: calm
                - label: Normal
                  value: normal
                - label: Aggressive
                  value: aggressive

    sound_section:
      name: Sound (optional)
      icon: mdi:speaker
      collapsed: true
      input:
        media_player:
          name: Speaker / Media player
          description: >
            Optional speaker for effect sounds. Leave empty to run the effects
            without sound. Anything playing on the speaker is stopped when the
            effect ends.
          default: ''
          selector:
            entity:
              filter:
                - domain: media_player
              multiple: false
        media_volume:
          name: Volume
          description: Speaker volume during the effect. The previous volume is restored afterwards.
          default: 60
          selector:
            number:
              min: 5
              max: 100
              step: 5
              unit_of_measurement: '%'
              mode: slider
        thunder_sound:
          name: Thunder sound
          description: >
            Played after each lightning burst. Use a URL or a media source path.
            The default matches the bundled sound pack uploaded to
            /media/halloween in Home Assistant. Clear it to disable.
          default: 'media-source://media_source/local/halloween/thunder.wav'
          selector:
            text:
        scream_sound:
          name: Scream sound
          description: >
            Played when the jump scare lights slam on, then repeated at a random
            interval (see below) until the effect ends. Clear it to disable.
          default: 'media-source://media_source/local/halloween/scream.wav'
          selector:
            text:
        scream_interval_min:
          name: Scream repeat interval (shortest)
          description: Shortest pause before the jump scare scream plays again.
          default: 10
          selector:
            number:
              min: 2
              max: 60
              step: 1
              unit_of_measurement: seconds
              mode: slider
        scream_interval_max:
          name: Scream repeat interval (longest)
          description: Longest pause before the jump scare scream plays again.
          default: 15
          selector:
            number:
              min: 2
              max: 60
              step: 1
              unit_of_measurement: seconds
              mode: slider
        power_failure_sound:
          name: Power failure sound
          description: Played once when the power failure effect starts. Clear it to disable.
          default: 'media-source://media_source/local/halloween/power_failure.wav'
          selector:
            text:
        heartbeat_sound:
          name: Heartbeat sound
          description: >
            Played once when the heartbeat effect starts. The lights follow the
            beat schedule of the bundled track (first beat after 2 s, 2.5 s to
            1.5 s between beats over 2 minutes). Clear it to disable.
          default: 'media-source://media_source/local/halloween/heartbeat.wav'
          selector:
            text:
        flicker_sound:
          name: Flicker sound
          description: >
            Played once when the haunted flicker effect starts, e.g. electrical
            buzzing. Clear it to disable.
          default: 'media-source://media_source/local/halloween/electrical_buzz.wav'
          selector:
            text:
  source_url: https://github.com/Nicolai-/ha-blueprints/blob/main/light/halloween-motion-effects.yaml

triggers:
  - trigger: state
    entity_id: !input motion_sensors
    to: 'on'

conditions:
  - alias: Selected date
    condition: template
    value_template: >
      {% if repeat_yearly %}
        {{ now().strftime('%m-%d') == (event_date | string)[5:10] }}
      {% else %}
        {{ now().date() | string == event_date | string }}
      {% endif %}
  - alias: Within time window
    condition: time
    after: !input start_time
    before: !input end_time
  - alias: At least one effect enabled
    condition: template
    value_template: "{{ enabled_effects | count > 0 }}"
  - alias: Cooldown since last effect has passed
    condition: template
    value_template: >
      {% set last_run = as_timestamp(this.attributes.last_triggered, 0) %}
      {{ as_timestamp(now()) - last_run > (effect_duration_minutes + cooldown_minutes) * 60 }}

variables:
  event_date: !input event_date
  repeat_yearly: !input repeat_yearly
  cooldown_minutes: !input cooldown_minutes
  effect_light_group: !input effect_light_group
  restore_lights: !input restore_lights
  enabled_effects: !input enabled_effects
  effect_history_helper: !input effect_history_helper
  shuffle_enabled: "{{ effect_history_helper | trim != '' }}"
  effect_duration_minutes: !input effect_duration_minutes
  media_player: !input media_player
  media_volume: !input media_volume
  thunder_sound: !input thunder_sound
  scream_sound: !input scream_sound
  scream_interval_min: !input scream_interval_min
  scream_interval_max: !input scream_interval_max
  power_failure_sound: !input power_failure_sound
  heartbeat_sound: !input heartbeat_sound
  flicker_sound: !input flicker_sound
  effect_intensity: !input effect_intensity
  # Delays in milliseconds. Per-light delays apply to direct (unicast) commands,
  # group delays stay slower because group commands are Zigbee broadcasts.
  # flicker_share is the chance (%) that each member light changes per flicker
  # step; at least one light always changes and never more than
  # flicker_max_lights, which keeps the Zigbee load flat for large groups.
  effect_timings:
    calm:
      flicker_light_min: 900
      flicker_light_max: 1800
      flicker_group_min: 1200
      flicker_group_max: 2200
      flicker_levels: [10, 25, 40, 55, 70, 85, 100]
      flicker_share: 0
      flicker_max_lights: 1
      blackout_chance: 10
      sputters: 2
      sputter_min: 600
      sputter_max: 1000
      strike_min: 7000
      strike_max: 14000
      flashes_min: 1
      flashes_max: 2
    normal:
      flicker_light_min: 400
      flicker_light_max: 1000
      flicker_group_min: 800
      flicker_group_max: 1700
      flicker_levels: [5, 15, 30, 50, 70, 85, 100]
      flicker_share: 30
      flicker_max_lights: 3
      blackout_chance: 12
      sputters: 3
      sputter_min: 400
      sputter_max: 800
      strike_min: 5000
      strike_max: 11000
      flashes_min: 1
      flashes_max: 3
    aggressive:
      flicker_light_min: 150
      flicker_light_max: 350
      flicker_group_min: 500
      flicker_group_max: 1000
      flicker_levels: [1, 1, 5, 10, 30, 70, 100, 100]
      flicker_share: 50
      flicker_max_lights: 4
      blackout_chance: 5
      sputters: 6
      sputter_min: 120
      sputter_max: 350
      strike_min: 3000
      strike_max: 7000
      flashes_min: 2
      flashes_max: 4
  timing: "{{ effect_timings[effect_intensity] }}"
  per_light_flicker: "{{ restore_lights | count > 0 }}"
  media_enabled: "{{ media_player | trim != '' }}"
  snapshot_entities: "{{ restore_lights if restore_lights | count > 0 else [effect_light_group] }}"
  heartbeat_ramp_s: 120
  snapshot_scene_id: "{{ this.entity_id | replace('automation.', '') ~ '_effect_snapshot' }}"

actions:
  - variables:
      # Shuffle bag: effects already played this round, in order
      played_effects: >
        {%- if shuffle_enabled -%}
          {{ states(effect_history_helper).split(',')
            | map('trim')
            | select('in', enabled_effects)
            | list }}
        {%- else -%}
          {{ [] }}
        {%- endif -%}
      new_round: "{{ enabled_effects | reject('in', played_effects) | list | count == 0 }}"
      candidate_effects: >
        {%- if not new_round -%}
          {{ enabled_effects | reject('in', played_effects) | list }}
        {%- elif enabled_effects | count > 1 -%}
          {#- Do not start a new round with the effect that just played -#}
          {{ enabled_effects | reject('eq', played_effects | last) | list }}
        {%- else -%}
          {{ enabled_effects }}
        {%- endif -%}
      selected_effect: "{{ candidate_effects | random }}"
      effect_history: "{{ ([selected_effect] if new_round else played_effects + [selected_effect]) | join(',') }}"
      effect_end_ts: "{{ as_timestamp(now()) + effect_duration_minutes * 60 }}"
      # Shared by the light intro and the scream loop so the first scream hits with the lights
      scare_blackout_ms: "{{ range(2000, 3500) | random }}"
      original_volume: "{{ state_attr(media_player, 'volume_level') if media_enabled else none }}"
      start_sound: >
        {{ {
          'power_failure': power_failure_sound,
          'heartbeat': heartbeat_sound,
          'flicker': flicker_sound
        }.get(selected_effect, '') | trim }}

  - action: logbook.log
    data:
      name: Halloween Motion Effects
      message: "Starting {{ selected_effect | replace('_', ' ') }} effect for {{ effect_duration_minutes }} minutes"
      entity_id: "{{ effect_light_group }}"

  - alias: Remember the selected effect for the shuffle
    if:
      - condition: template
        value_template: "{{ shuffle_enabled }}"
    then:
      - action: input_text.set_value
        continue_on_error: true
        target:
          entity_id: "{{ effect_history_helper }}"
        data:
          value: "{{ effect_history }}"

  - alias: Snapshot lights before the effect
    action: scene.create
    data:
      scene_id: "{{ snapshot_scene_id }}"
      snapshot_entities: "{{ snapshot_entities }}"

  - alias: Prepare speaker
    if:
      - condition: template
        value_template: "{{ media_enabled }}"
    then:
      - action: media_player.volume_set
        continue_on_error: true
        target:
          entity_id: "{{ media_player }}"
        data:
          volume_level: "{{ media_volume / 100 }}"
      - alias: Play the effect start sound
        if:
          - condition: template
            value_template: "{{ start_sound != '' }}"
        then:
          - action: media_player.play_media
            continue_on_error: true
            target:
              entity_id: "{{ media_player }}"
            data:
              media_content_id: "{{ start_sound }}"
              media_content_type: music

  - variables:
      # The heartbeat track starts with 2 s of silence before the first beat
      heartbeat_start_ts: "{{ as_timestamp(now()) + 2 }}"

  - alias: Prepare lights for the effect
    choose:
      - alias: Lightning and heartbeat start from darkness
        conditions:
          - condition: template
            value_template: "{{ selected_effect in ['lightning', 'heartbeat'] }}"
        sequence:
          - action: light.turn_off
            target:
              entity_id: "{{ effect_light_group }}"
            data:
              transition: 0
          - delay:
              seconds: 2

  - alias: Run the effect until the duration has passed
    parallel:
      - alias: Light effect loop
        repeat:
          while:
            - condition: template
              value_template: "{{ as_timestamp(now()) < effect_end_ts }}"
          sequence:
            - choose:
                - alias: Lightning storm
                  conditions:
                    - condition: template
                      value_template: "{{ selected_effect == 'lightning' }}"
                  sequence:
                    - alias: Wait for the next strike
                      delay:
                        milliseconds: "{{ range(timing.strike_min, timing.strike_max) | random }}"
                    - alias: Flash burst
                      repeat:
                        count: "{{ range(timing.flashes_min, timing.flashes_max + 1) | random }}"
                        sequence:
                          - action: light.turn_on
                            target:
                              entity_id: "{{ effect_light_group }}"
                            data:
                              brightness_pct: 100
                              transition: 0
                          - delay:
                              milliseconds: "{{ range(80, 200) | random }}"
                          - action: light.turn_off
                            target:
                              entity_id: "{{ effect_light_group }}"
                            data:
                              transition: 0
                          - delay:
                              milliseconds: "{{ range(150, 400) | random }}"
                    - alias: Thunder follows the flash
                      if:
                        - condition: template
                          value_template: "{{ media_enabled and thunder_sound | trim != '' }}"
                      then:
                        - delay:
                            milliseconds: "{{ range(300, 1500) | random }}"
                        - action: media_player.play_media
                          continue_on_error: true
                          target:
                            entity_id: "{{ media_player }}"
                          data:
                            media_content_id: "{{ thunder_sound | trim }}"
                            media_content_type: music

                - alias: Jump scare intro (first round only)
                  conditions:
                    - condition: template
                      value_template: "{{ selected_effect == 'jump_scare' and repeat.index == 1 }}"
                  sequence:
                    - alias: Silent blackout
                      action: light.turn_off
                      target:
                        entity_id: "{{ effect_light_group }}"
                      data:
                        transition: 0
                    - delay:
                        milliseconds: "{{ scare_blackout_ms }}"
                    - alias: Slam the lights on
                      action: light.turn_on
                      target:
                        entity_id: "{{ effect_light_group }}"
                      data:
                        brightness_pct: 100
                        transition: 0
                    - delay:
                        seconds: 3

                - alias: Power failure
                  conditions:
                    - condition: template
                      value_template: "{{ selected_effect == 'power_failure' }}"
                  sequence:
                    - alias: Sputter
                      repeat:
                        count: "{{ timing.sputters }}"
                        sequence:
                          - action: light.turn_on
                            target:
                              entity_id: "{{ restore_lights | random if per_light_flicker else effect_light_group }}"
                            data:
                              brightness_pct: "{{ timing.flicker_levels | random }}"
                              transition: 0
                          - delay:
                              milliseconds: >
                                {% if per_light_flicker %}
                                  {{ range(timing.sputter_min, timing.sputter_max) | random }}
                                {% else %}
                                  {{ range([timing.sputter_min, 500] | max, [timing.sputter_max, 900] | max) | random }}
                                {% endif %}
                    - alias: Fade out
                      action: light.turn_on
                      target:
                        entity_id: "{{ effect_light_group }}"
                      data:
                        brightness_pct: 3
                        transition: 3
                    - delay:
                        seconds: 3
                    - alias: Blackout
                      action: light.turn_off
                      target:
                        entity_id: "{{ effect_light_group }}"
                      data:
                        transition: 0
                    - delay:
                        milliseconds: "{{ range(3000, 6000) | random }}"
                    - alias: Power surges back
                      action: light.turn_on
                      target:
                        entity_id: "{{ effect_light_group }}"
                      data:
                        brightness_pct: 100
                        transition: 0
                    - delay:
                        milliseconds: "{{ range(5000, 10000) | random }}"

                - alias: Heartbeat
                  conditions:
                    - condition: template
                      value_template: "{{ selected_effect == 'heartbeat' }}"
                  sequence:
                    - variables:
                        # Same schedule as heartbeat.wav: the period shrinks from 2.5 s to
                        # 1.5 s over the first 2 minutes, measured at the previous beat
                        beat_offset_s: >
                          {%- set ns = namespace(t=0.0) -%}
                          {%- for _ in range(repeat.index - 1) -%}
                            {%- set ns.t = ns.t + 2.5 - [ns.t / heartbeat_ramp_s, 1] | min -%}
                          {%- endfor -%}
                          {{ ns.t }}
                        beat_period_s: "{{ 2.5 - [beat_offset_s / heartbeat_ramp_s, 1] | min }}"
                    - alias: Wait for the beat on the shared timeline (avoids drift)
                      delay:
                        milliseconds: >
                          {% set wait_ms = ((heartbeat_start_ts + beat_offset_s - as_timestamp(now())) * 1000) | int %}
                          {% set remaining_ms = ((effect_end_ts - as_timestamp(now())) * 1000) | int %}
                          {{ [[wait_ms, remaining_ms] | min, 0] | max }}
                    - alias: Beat
                      action: light.turn_on
                      target:
                        entity_id: "{{ effect_light_group }}"
                      data:
                        brightness_pct: 100
                        transition: 0
                    - delay:
                        milliseconds: 200
                    - alias: Fade between beats
                      action: light.turn_on
                      target:
                        entity_id: "{{ effect_light_group }}"
                      data:
                        brightness_pct: 5
                        transition: "{{ (beat_period_s * 0.6) | round(1) }}"

              # Haunted flicker, also used after the jump scare intro
              default:
                - if:
                    - alias: Occasional short blackout
                      condition: template
                      value_template: "{{ range(0, 100) | random < timing.blackout_chance }}"
                  then:
                    - action: light.turn_off
                      target:
                        entity_id: "{{ effect_light_group }}"
                      data:
                        transition: 0
                    - delay:
                        milliseconds: "{{ range(400, 1500) | random }}"
                  else:
                    - variables:
                        flicker_targets: >
                          {%- if per_light_flicker -%}
                            {#- Roll flicker_share per light to decide how many change, then cap it -#}
                            {%- set ns = namespace(hits=0, lights=[], pool=restore_lights) -%}
                            {%- for _ in restore_lights -%}
                              {%- if range(0, 100) | random < timing.flicker_share -%}
                                {%- set ns.hits = ns.hits + 1 -%}
                              {%- endif -%}
                            {%- endfor -%}
                            {%- set light_count = [[ns.hits, 1] | max, timing.flicker_max_lights] | min -%}
                            {#- Pick that many distinct random member lights -#}
                            {%- for _ in range(light_count) -%}
                              {%- set picked = ns.pool | random -%}
                              {%- set ns.lights = ns.lights + [picked] -%}
                              {%- set ns.pool = ns.pool | reject('eq', picked) | list -%}
                            {%- endfor -%}
                            {{ ns.lights }}
                          {%- else -%}
                            {{ [effect_light_group] }}
                          {%- endif -%}
                    - alias: Flicker random member lights, each to its own brightness
                      repeat:
                        for_each: "{{ flicker_targets }}"
                        sequence:
                          - action: light.turn_on
                            target:
                              entity_id: "{{ repeat.item }}"
                            data:
                              brightness_pct: "{{ timing.flicker_levels | random }}"
                              transition: 0
                    - delay:
                        milliseconds: >
                          {% if per_light_flicker %}
                            {{ range(timing.flicker_light_min, timing.flicker_light_max) | random }}
                          {% else %}
                            {{ range(timing.flicker_group_min, timing.flicker_group_max) | random }}
                          {% endif %}

      - alias: Repeat the scream during the jump scare
        if:
          - condition: template
            value_template: "{{ selected_effect == 'jump_scare' and media_enabled and scream_sound | trim != '' }}"
        then:
          - alias: Wait for the lights to slam on
            delay:
              milliseconds: "{{ scare_blackout_ms }}"
          - repeat:
              while:
                - condition: template
                  value_template: "{{ as_timestamp(now()) < effect_end_ts }}"
              sequence:
                - action: media_player.play_media
                  continue_on_error: true
                  target:
                    entity_id: "{{ media_player }}"
                  data:
                    media_content_id: "{{ scream_sound | trim }}"
                    media_content_type: music
                - alias: Wait the scream interval, but never past the end of the effect
                  delay:
                    milliseconds: >
                      {% set remaining_ms = ((effect_end_ts - as_timestamp(now())) * 1000) | int %}
                      {% set shortest_ms = ([scream_interval_min, scream_interval_max] | min * 1000) | int %}
                      {% set longest_ms = ([scream_interval_min, scream_interval_max] | max * 1000) | int %}
                      {{ [[range(shortest_ms, longest_ms + 1) | random, remaining_ms] | min, 0] | max }}

  - alias: Restore lights
    action: scene.turn_on
    target:
      entity_id: "{{ 'scene.' ~ snapshot_scene_id }}"
    data:
      transition: 1

  - alias: Restore speaker
    if:
      - condition: template
        value_template: "{{ media_enabled }}"
    then:
      - action: media_player.media_stop
        continue_on_error: true
        target:
          entity_id: "{{ media_player }}"
      - if:
          - condition: template
            value_template: "{{ original_volume is number }}"
        then:
          - action: media_player.volume_set
            continue_on_error: true
            target:
              entity_id: "{{ media_player }}"
            data:
              volume_level: "{{ original_volume }}"

  - action: logbook.log
    data:
      name: Halloween Motion Effects
      message: "Finished {{ selected_effect | replace('_', ' ') }} effect, lights restored"
      entity_id: "{{ effect_light_group }}"

mode: single
max_exceeded: silent
