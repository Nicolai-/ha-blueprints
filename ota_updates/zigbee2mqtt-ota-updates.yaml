blueprint:
  name: Zigbee2MQTT OTA Update
  description: >
    Automatically checks for and installs Zigbee2MQTT OTA updates for supported entities.

    - Filters by MQTT integration
    - Supports selecting domains (e.g., light, sensor)
    - Allows excluding devices (entire devices, not individual entities)

    Version 1.2.0 – Optimized and switched to device-based exclusion
  domain: automation
  input:
    included_domains:
      name: Included Domains
      description: Choose which entity domains should be included for OTA updates.
      selector:
        select:
          mode: list
          options:
            - light
            - sensor
            - switch
            - binary_sensor
            - cover
            - fan
            - climate
            - lock

    exclude_devices:
      name: Excluded Devices
      description: Select devices to exclude from the OTA update process.
      default: []
      selector:
        device:
          entity:
            domain:
              - light
              - sensor
              - switch
              - binary_sensor
              - cover
              - fan
              - climate
              - lock
          multiple: true
trigger: []

condition: []

action:
  - alias: Define variables
    variables:
      included_domains: !input "included_domains"
      exclude_devices: !input "exclude_devices"

      # Get all update entities linked to excluded devices
      excluded_update_entities: >
        {{ exclude_devices
          | map('device_entities')
          | map('select', 'match', '^update\\.')
          | map('list') | sum(start=[]) }}

      # All MQTT update entities that are ON (need updates)
      mqtt_update_entities: >
        {{ states.update
          | selectattr('entity_id', 'in', integration_entities('mqtt'))
          | selectattr('state', 'eq', 'on')
          | map(attribute='entity_id')
          | list }}

      # Filter by domain and excluded devices
      update_entities: >
        {% set ns = namespace(update_entities=[]) %}
        {% for entity_id in mqtt_update_entities %}
          {% set device_id = device_id(entity_id) %}
          {% if device_id and device_id not in exclude_devices %}
            {% set domains = device_entities(device_id)
              | map('regex_findall', '^(.*?)\\.')
              | map('first')
              | reject('equalto', 'update')
              | list
              | unique %}
            {% if domains | select('in', included_domains) | list | count > 0 %}
              {% set ns.update_entities = ns.update_entities + [entity_id] %}
            {% endif %}
          {% endif %}
        {% endfor %}
        {{ ns.update_entities | unique | list }}

  - alias: Run OTA updates one-by-one
    repeat:
      for_each: "{{ update_entities }}"
      sequence:
        - variables:
            triggered_entity: "{{ repeat.item }}"

        - service: logbook.log
          data:
            name: Zigbee2MQTT OTA Update
            message: "Processing OTA update for {{ triggered_entity }}"
            entity_id: "{{ triggered_entity }}"

        - choose:
            - conditions:
                - condition: template
                  value_template: "{{ not is_state_attr(triggered_entity, 'in_progress', true) }}"
              sequence:
                - action: logbook.log
                  data:
                    name: Zigbee2MQTT OTA Update
                    message: "Starting OTA update"
                    entity_id: "{{ triggered_entity }}"

                - action: update.install
                  target:
                    entity_id: "{{ triggered_entity }}"

                - wait_template: "{{ is_state_attr(triggered_entity, 'in_progress', true) }}"
                  timeout: "00:02:00"
                  continue_on_timeout: true
                  alias: Wait for the update to start

                - action: logbook.log
                  data:
                    name: Zigbee2MQTT OTA Update
                    message: "Waiting for OTA update to complete"
                    entity_id: "{{ triggered_entity }}"

                - wait_template: "{{ is_state_attr(triggered_entity, 'in_progress', false) }}"
                  timeout: "02:00:00"
                  continue_on_timeout: true
                  alias: Wait for the update to complete

          default:
            - action: logbook.log
              data:
                name: Zigbee2MQTT OTA Update
                message: "Skipping {{ triggered_entity }} because update already in progress"
                entity_id: "{{ triggered_entity }}"

mode: single
