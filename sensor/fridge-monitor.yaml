blueprint:
  name: Fridge Monitor
  description: >
    Monitor a fridge door sensor and temperature sensor.


    Sends repeated TTS alerts while the fridge door remains open, sends
    configurable notification actions when the door has been open too long,
    and alerts when the temperature remains above the configured threshold.


    **Version:** 1.4.0


    **Changelog:**

    - 1.4.0:
      - Door and temperature alerts run independently. A door alert no
        longer stops an active temperature alert (or the other way round),
        recovery notifications are no longer lost, and speakers are no
        longer left at the alert volume.
      - Description paragraphs render as separate paragraphs in the UI.
      - All speakers announce at the same time instead of one after another.
      - Announcements stop and the recovery notification is sent as soon as
        the door closes or the temperature is back, instead of after the
        repeat interval.
      - An unavailable sensor no longer counts as recovered. Announcements
        pause until the sensor reports again. Back to normal sends the
        recovery notification. Still open or too warm starts the alert
        over after its delay, without a second alert running alongside.
      - While the door alert is announcing, the temperature announcement
        waits (its notifications are still sent). The two no longer talk
        over each other, and overlapping announcements no longer leave the
        speakers at the alert volume.

    - 1.3.0: Added support for multiple TTS speakers

    - 1.2.0: Added recovery notifications and explicit door/temperature labels in notification messages

    - 1.1.0: Added configurable TTS volume with volume restore after messages

    - 1.0.1: Changed TTS repeat interval from minutes to seconds

    - 1.0.0: Initial release with door and temperature monitoring
  domain: automation
  homeassistant:
    min_version: "2024.10.0"
  author: Nicolai-
  input:
    door_sensor_entity:
      name: (Required) Fridge Door Sensor
      description: Binary sensor that is on/open when the fridge door is open.
      selector:
        entity:
          multiple: false
          filter:
            domain: binary_sensor
            device_class:
              - door
              - window
              - opening
    temperature_sensor_entity:
      name: (Required) Fridge Temperature Sensor
      description: Temperature sensor inside the fridge or freezer.
      selector:
        entity:
          multiple: false
          filter:
            domain: sensor
            device_class: temperature
    tts_engine_entity:
      name: (Required) TTS Engine
      description: Text-to-speech entity used by the tts.speak action.
      selector:
        entity:
          multiple: false
          filter:
            domain: tts
    speaker_entity:
      name: (Required) Speaker(s)
      description: Media players that should announce the TTS warnings.
      selector:
        entity:
          multiple: true
          filter:
            domain: media_player
    door_tts_delay:
      name: Door TTS Delay
      description: Minutes the door must remain open before repeated TTS warnings start.
      default: 5
      selector:
        number:
          min: 0.5
          max: 60
          step: 0.5
          unit_of_measurement: minutes
          mode: slider
    door_notification_delay:
      name: Door Notification Delay
      description: >
        Minutes the door must remain open before notification actions run.
        Keep this equal to or higher than the Door TTS Delay.
      default: 10
      selector:
        number:
          min: 0.5
          max: 120
          step: 0.5
          unit_of_measurement: minutes
          mode: slider
    temperature_threshold:
      name: Temperature Threshold
      description: Temperature threshold that triggers alerts when the sensor stays above it.
      default: 10
      selector:
        number:
          min: -40
          max: 20
          step: 0.5
          unit_of_measurement: °C
          mode: slider
    temperature_duration:
      name: Temperature Duration
      description: Minutes the temperature must remain above the threshold before alerting.
      default: 10
      selector:
        number:
          min: 0.5
          max: 120
          step: 0.5
          unit_of_measurement: minutes
          mode: slider
    tts_repeat_interval:
      name: TTS Repeat Interval
      description: Seconds between repeated TTS announcements while the alert remains active.
      default: 60
      selector:
        number:
          min: 5
          max: 1800
          step: 5
          unit_of_measurement: seconds
          mode: slider
    tts_volume_level:
      name: TTS Volume Level
      description: Speaker volume used for fridge alert messages.
      default: 70
      selector:
        number:
          min: 1
          max: 100
          step: 1
          unit_of_measurement: "%"
          mode: slider
    tts_volume_restore_delay:
      name: TTS Volume Restore Delay
      description: Seconds to wait after starting TTS before restoring the previous speaker volume.
      default: 10
      selector:
        number:
          min: 1
          max: 120
          step: 1
          unit_of_measurement: seconds
          mode: slider
    door_tts_message:
      name: Door TTS Message
      description: Message spoken while the fridge door remains open.
      default: 'The fridge door is still open. Please close it.'
      selector:
        text:
          multiline: false
          type: text
    temperature_tts_message:
      name: Temperature TTS Message
      description: Message spoken while the fridge temperature alert remains active.
      default: 'The fridge temperature is too high and needs attention.'
      selector:
        text:
          multiline: false
          type: text
    door_recovery_message:
      name: Door Recovery Message
      description: Notification message sent after a notified door alert clears.
      default: 'The fridge door is closed again.'
      selector:
        text:
          multiline: false
          type: text
    temperature_recovery_message:
      name: Temperature Recovery Message
      description: Notification message sent after a notified temperature alert clears.
      default: 'The fridge temperature is back below the alert threshold.'
      selector:
        text:
          multiline: false
          type: text
    notification_actions:
      name: Notification Actions
      description: >
        Optional actions to run for door and temperature notifications. Add a
        mobile notification, notify.smtp email action, persistent notification,
        or any other Home Assistant action. Templates can use alert_title,
        alert_message, alert_cause, alert_entity, current_temperature, and
        temperature_threshold.
      default: []
      selector:
        action: {}
  source_url: https://github.com/Nicolai-/ha-blueprints/blob/main/sensor/fridge-monitor.yaml

triggers:
  - trigger: state
    entity_id: !input door_sensor_entity
    to: 'on'
    for:
      minutes: !input door_tts_delay
    id: door_tts
  - trigger: state
    entity_id: !input door_sensor_entity
    to: 'on'
    for:
      minutes: !input door_notification_delay
    id: door_notification
  - trigger: numeric_state
    entity_id: !input temperature_sensor_entity
    above: !input temperature_threshold
    for:
      minutes: !input temperature_duration
    id: temperature_alert

variables:
  door_sensor_entity: !input door_sensor_entity
  temperature_sensor_entity: !input temperature_sensor_entity
  tts_engine_entity: !input tts_engine_entity
  speaker_entity: !input speaker_entity
  # Automations created before 1.3.0 store a single speaker as a string
  speakers: "{{ [speaker_entity] if speaker_entity is string else speaker_entity | list }}"
  door_tts_delay: !input door_tts_delay
  door_tts_message: !input door_tts_message
  temperature_tts_message: !input temperature_tts_message
  door_recovery_message: !input door_recovery_message
  temperature_recovery_message: !input temperature_recovery_message
  tts_volume_level: !input tts_volume_level
  tts_volume_level_normalized: "{{ (tts_volume_level | float(70) / 100) | round(2) }}"
  notification_actions: !input notification_actions
  temperature_threshold: !input temperature_threshold
  current_temperature: "{{ states(temperature_sensor_entity) }}"
  notification_actions_configured: "{{ notification_actions | count > 0 }}"

actions:
  - choose:
      - alias: Door has been open long enough to notify
        conditions:
          - condition: trigger
            id: door_notification
        sequence:
          - variables:
              alert_title: 'Fridge Door Open'
              alert_message: 'Door alert: The fridge door has been open for too long.'
              alert_cause: 'door'
              alert_entity: "{{ door_sensor_entity }}"
          - action: logbook.log
            data:
              name: 'Fridge Monitor'
              message: "{{ alert_message }}"
              entity_id: "{{ alert_entity }}"
          - choose:
              - conditions: "{{ notification_actions_configured }}"
                sequence: !input notification_actions
          - alias: Wait until the door is no longer open (the door TTS run keeps announcing)
            wait_template: "{{ not is_state(door_sensor_entity, 'on') }}"
            timeout:
              hours: 24
            continue_on_timeout: false
          # A sensor that drops out and comes back still open re-arms the
          # trigger, which starts a new run after the delay. This run then
          # hands over instead of running alongside it.
          - alias: If the sensor dropped out, wait for it to report again
            wait_template: "{{ states(door_sensor_entity) in ['on', 'off'] }}"
            timeout:
              hours: 24
            continue_on_timeout: false
          - alias: If the door is still open, stop when the new run takes over, unless it closes first
            wait_template: "{{ is_state(door_sensor_entity, 'off') }}"
            timeout:
              minutes: !input door_notification_delay
            continue_on_timeout: false
          - variables:
              alert_title: 'Fridge Door Recovered'
              alert_message: "Door recovered: {{ door_recovery_message }}"
              alert_cause: 'door'
              alert_entity: "{{ door_sensor_entity }}"
          - action: logbook.log
            data:
              name: 'Fridge Monitor'
              message: "{{ alert_message }}"
              entity_id: "{{ alert_entity }}"
          - choose:
              - conditions: "{{ notification_actions_configured }}"
                sequence: !input notification_actions
      - alias: Door has been open long enough for TTS
        conditions:
          - condition: trigger
            id: door_tts
        sequence:
          - variables:
              alert_title: 'Fridge Door Open'
              alert_message: 'The fridge door is open.'
              alert_cause: 'door'
              alert_entity: "{{ door_sensor_entity }}"
              tts_message: "{{ door_tts_message }}"
          - action: logbook.log
            data:
              name: 'Fridge Monitor'
              message: "{{ alert_message }}"
              entity_id: "{{ alert_entity }}"
          - repeat:
              while:
                - condition: state
                  entity_id: !input door_sensor_entity
                  state: 'on'
              sequence:
                # The temperature alert reuses these steps through the YAML
                # anchor (*announce_steps). They speak tts_message.
                - alias: Announce on all speakers, then restore their volume
                  sequence: &announce_steps
                    - variables:
                        previous_volumes: >-
                          {%- set ns = namespace(volumes=[]) -%}
                          {%- for speaker in speakers -%}
                            {%- set volume = state_attr(speaker, 'volume_level') -%}
                            {#- A speaker already at the alert volume is in use by another
                                announcement, which restores it. Saving that volume here
                                would leave the speaker at the alert volume. -#}
                            {%- set restore = volume is number
                                and (volume - tts_volume_level_normalized) | abs > 0.02 -%}
                            {%- set ns.volumes = ns.volumes + [volume if restore else none] -%}
                          {%- endfor -%}
                          {{ ns.volumes }}
                    - action: media_player.volume_set
                      target:
                        entity_id: "{{ speakers }}"
                      data:
                        volume_level: "{{ tts_volume_level_normalized }}"
                    - action: tts.speak
                      target:
                        entity_id: !input tts_engine_entity
                      data:
                        media_player_entity_id: "{{ speakers }}"
                        message: "{{ tts_message }}"
                        cache: true
                    - alias: Keep the alert volume while the message plays, or until the alert ends
                      wait_template: >-
                        {{ not is_state(door_sensor_entity, 'on') if alert_cause == 'door'
                           else not (states(temperature_sensor_entity) | is_number
                                     and states(temperature_sensor_entity) | float > temperature_threshold | float) }}
                      timeout:
                        seconds: !input tts_volume_restore_delay
                      continue_on_timeout: true
                    - alias: Restore the previous volume on each speaker
                      repeat:
                        for_each: "{{ range(speakers | count) | list }}"
                        sequence:
                          - if: "{{ previous_volumes[repeat.item] is number }}"
                            then:
                              - action: media_player.volume_set
                                target:
                                  entity_id: "{{ speakers[repeat.item] }}"
                                data:
                                  volume_level: "{{ previous_volumes[repeat.item] }}"
                - alias: Wait for the next announcement, or stop as soon as the door is no longer open
                  wait_template: "{{ not is_state(door_sensor_entity, 'on') }}"
                  timeout:
                    seconds: !input tts_repeat_interval
                  continue_on_timeout: true
      - alias: Temperature has stayed above threshold
        conditions:
          - condition: trigger
            id: temperature_alert
        sequence:
          - variables:
              alert_title: 'Fridge Temperature Alert'
              alert_message: "Temperature alert: The fridge temperature has stayed above {{ temperature_threshold }}°C."
              alert_cause: 'temperature'
              alert_entity: "{{ temperature_sensor_entity }}"
              tts_message: "{{ temperature_tts_message }}"
          - action: logbook.log
            data:
              name: 'Fridge Monitor'
              message: "{{ alert_message }}"
              entity_id: "{{ alert_entity }}"
          - choose:
              - conditions: "{{ notification_actions_configured }}"
                sequence: !input notification_actions
          - repeat:
              while:
                - alias: The sensor reports a value and it is still too warm
                  condition: template
                  value_template: >-
                    {{ states(temperature_sensor_entity) | is_number
                       and states(temperature_sensor_entity) | float > temperature_threshold | float }}
              sequence:
                - alias: Announce, unless the door alert is announcing (it goes first)
                  if:
                    - alias: The door has not been open long enough for the door TTS alert
                      condition: template
                      value_template: >-
                        {{ not (is_state(door_sensor_entity, 'on')
                                and (now() - states[door_sensor_entity].last_changed).total_seconds()
                                    >= door_tts_delay | float * 60) }}
                  then: *announce_steps
                - alias: Wait for the next announcement, or stop as soon as the temperature is back or the sensor drops out
                  wait_template: >-
                    {{ not (states(temperature_sensor_entity) | is_number
                            and states(temperature_sensor_entity) | float > temperature_threshold | float) }}
                  timeout:
                    seconds: !input tts_repeat_interval
                  continue_on_timeout: true
          # A sensor that drops out and comes back still too warm re-arms the
          # trigger, which starts a new run after the temperature duration.
          # This run then hands over instead of running alongside it.
          - alias: If the sensor dropped out, wait for it to report again
            wait_template: "{{ states(temperature_sensor_entity) | is_number }}"
            timeout:
              hours: 24
            continue_on_timeout: false
          - alias: If it is still too warm, stop when the new run takes over, unless it recovers first
            wait_template: >-
              {{ states(temperature_sensor_entity) | is_number
                 and states(temperature_sensor_entity) | float <= temperature_threshold | float }}
            timeout:
              minutes: !input temperature_duration
            continue_on_timeout: false
          - variables:
              alert_title: 'Fridge Temperature Recovered'
              alert_message: "Temperature recovered: {{ temperature_recovery_message }}"
              alert_cause: 'temperature'
              alert_entity: "{{ temperature_sensor_entity }}"
          - action: logbook.log
            data:
              name: 'Fridge Monitor'
              message: "{{ alert_message }}"
              entity_id: "{{ alert_entity }}"
          - choose:
              - conditions: "{{ notification_actions_configured }}"
                sequence: !input notification_actions

mode: parallel
max: 10
max_exceeded: silent
